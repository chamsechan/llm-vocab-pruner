<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Reordered vocabulary pruning</title>
  <desc id="desc">A one-time synchronized permutation moves retained tokens and embedding rows into an output prefix. Runtime generation uses compact logits directly without an ID map.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#081521"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="keep" x2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="head" x2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#7891a8"/>
    </marker>
    <path id="move-a" d="M382 154 C445 122 476 122 536 154"/>
    <path id="move-b" d="M382 232 C446 224 477 177 536 193"/>
    <path id="move-c" d="M382 271 C446 264 477 216 536 232"/>
    <path id="move-d" d="M382 193 C446 248 477 278 536 284"/>
    <path id="runtime" d="M214 406H1028"/>
  </defs>

  <rect width="1200" height="500" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="498" rx="21" fill="none" stroke="#29455d"/>

  <g font-family="Inter,Arial,sans-serif">
    <text x="48" y="46" fill="#f8fafc" font-size="25" font-weight="700">Reordered Vocabulary Pruning</text>
    <text x="48" y="72" fill="#91a7ba" font-size="14">Reorder once during export. Generate directly from a compact output prefix.</text>

    <text x="48" y="108" fill="#8ca5ba" font-size="11" font-weight="700" letter-spacing="1.4">BEFORE</text>
    <rect x="48" y="120" width="334" height="200" rx="14" fill="#0c1d2c" stroke="#35516a"/>
    <text x="70" y="145" fill="#dbeafe" font-size="14" font-weight="700">Original IDs + Embedding rows</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
      <rect x="70" y="158" width="286" height="29" rx="6" fill="#11384e"/>
      <text x="84" y="177" fill="#67e8f9">old 2</text><text x="151" y="177" fill="#dbeafe">KEEP</text><text x="220" y="177" fill="#8ca5ba">E[2]</text>
      <rect x="70" y="197" width="286" height="29" rx="6" fill="#1a2b3b"/>
      <text x="84" y="216" fill="#94a3b8">old 5</text><text x="151" y="216" fill="#94a3b8">INPUT ONLY</text><text x="260" y="216" fill="#73889b">E[5]</text>
      <rect x="70" y="236" width="286" height="29" rx="6" fill="#11384e"/>
      <text x="84" y="255" fill="#67e8f9">old 8</text><text x="151" y="255" fill="#dbeafe">KEEP</text><text x="220" y="255" fill="#8ca5ba">E[8]</text>
      <rect x="70" y="275" width="286" height="29" rx="6" fill="#272149"/>
      <text x="84" y="294" fill="#d8b4fe">old 11</text><text x="151" y="294" fill="#f5d0fe">KEEP · EOS</text><text x="260" y="294" fill="#a78bfa">E[11]</text>
    </g>

    <g text-anchor="middle">
      <path d="M414 212H501" stroke="#7891a8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
      <text x="457" y="187" fill="#e2e8f0" font-size="12" font-weight="700">ONE TIME</text>
      <text x="457" y="203" fill="#67e8f9" font-size="11">same permutation P</text>
    </g>

    <text x="536" y="108" fill="#67e8f9" font-size="11" font-weight="700" letter-spacing="1.4">AFTER EXPORT</text>
    <rect x="536" y="120" width="616" height="200" rx="14" fill="#0c1d2c" stroke="#22d3ee"/>
    <text x="558" y="145" fill="#dbeafe" font-size="14" font-weight="700">Reordered tokenizer and full Embedding stay aligned</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
      <rect x="558" y="158" width="392" height="29" rx="6" fill="url(#keep)"/>
      <text x="572" y="177" fill="#041823">new 0 ← old 2</text><text x="710" y="177" fill="#041823">KEEP</text><text x="800" y="177" fill="#041823">E_new[0] = E_old[2]</text>
      <rect x="558" y="197" width="392" height="29" rx="6" fill="url(#keep)"/>
      <text x="572" y="216" fill="#041823">new 1 ← old 8</text><text x="710" y="216" fill="#041823">KEEP</text><text x="800" y="216" fill="#041823">E_new[1] = E_old[8]</text>
      <rect x="558" y="236" width="392" height="29" rx="6" fill="url(#head)"/>
      <text x="572" y="255" fill="#fff">new 2 ← old 11</text><text x="710" y="255" fill="#fff">KEEP · EOS</text><text x="820" y="255" fill="#fff">E_new[2] = E_old[11]</text>
      <path d="M552 273H1128" stroke="#34d399" stroke-width="1.4" stroke-dasharray="5 4"/>
      <text x="1128" y="268" text-anchor="end" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">OUTPUT PREFIX K</text>
      <rect x="558" y="282" width="392" height="29" rx="6" fill="#1a2b3b"/>
      <text x="572" y="301" fill="#94a3b8">new 3 ← old 5</text><text x="710" y="301" fill="#94a3b8">INPUT ONLY</text><text x="820" y="301" fill="#73889b">E_new[3] = E_old[5]</text>
    </g>

    <g transform="translate(978 164)">
      <rect width="150" height="88" rx="10" fill="#091723" stroke="#324b60"/>
      <text x="75" y="25" text-anchor="middle" fill="#dbeafe" font-size="11" font-weight="700">Invariant</text>
      <text x="14" y="50" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">token(t) → new j</text>
      <text x="14" y="69" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">lookup(j) → same E</text>
    </g>

    <g fill="#67e8f9" filter="url(#glow)">
      <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#move-a"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="2.6s" begin=".4s" repeatCount="indefinite"><mpath href="#move-b"/></animateMotion></circle>
      <circle r="4" fill="#d8b4fe"><animateMotion dur="2.6s" begin=".8s" repeatCount="indefinite"><mpath href="#move-c"/></animateMotion></circle>
      <circle r="4" fill="#94a3b8"><animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#move-d"/></animateMotion></circle>
    </g>

    <text x="48" y="348" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1.4">RUNTIME · NO ID MAP</text>
    <rect x="48" y="362" width="1104" height="98" rx="14" fill="#0a1a28" stroke="#2d465b"/>

    <g text-anchor="middle">
      <g><rect x="70" y="384" width="144" height="44" rx="9" fill="#10283a" stroke="#3c5c74"/><text x="142" y="402" fill="#dbeafe" font-size="11" font-weight="700">New token IDs</text><text x="142" y="418" fill="#8ca5ba" font-size="10">0..V_input−1</text></g>
      <g><rect x="280" y="384" width="174" height="44" rx="9" fill="#10283a" stroke="#22d3ee"/><text x="367" y="402" fill="#dbeafe" font-size="11" font-weight="700">Full Embedding</text><text x="367" y="418" fill="#67e8f9" font-size="10">[V_input, H]</text></g>
      <g><rect x="520" y="384" width="142" height="44" rx="9" fill="#10283a" stroke="#526e8b"/><text x="591" y="411" fill="#dbeafe" font-size="11" font-weight="700">Transformer</text></g>
      <g><rect x="728" y="384" width="174" height="44" rx="9" fill="#10283a" stroke="#a855f7"/><text x="815" y="402" fill="#dbeafe" font-size="11" font-weight="700">Compact LM Head</text><text x="815" y="418" fill="#d8b4fe" font-size="10">logits [..., K]</text></g>
      <g><rect x="968" y="384" width="160" height="44" rx="9" fill="#10283a" stroke="#34d399"/><text x="1048" y="402" fill="#dbeafe" font-size="11" font-weight="700">Direct decode</text><text x="1048" y="418" fill="#6ee7b7" font-size="10">no scatter · no map</text></g>
    </g>

    <g fill="none" stroke="#7891a8" stroke-width="2" marker-end="url(#arrow)">
      <path d="M214 406H280"/><path d="M454 406H520"/><path d="M662 406H728"/><path d="M902 406H968"/>
    </g>
    <circle r="4" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#runtime"/></animateMotion></circle>

    <text x="600" y="482" text-anchor="middle" fill="#8299ad" font-size="11">All input vectors remain available. Only IDs in the prefix [0, K) can be generated.</text>
  </g>
</svg>

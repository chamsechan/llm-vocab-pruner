<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Reorder, copy, and prune an asymmetric vocabulary</title>
  <desc id="desc">The original embedding is reordered into a full embedding. The full embedding remains while its rows are copied to an untied LM head, where the input-only tail is pruned.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#10263a"/></linearGradient>
    <linearGradient id="output" x2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="input" x2="1"><stop stop-color="#78350f"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <g id="rowOutput"><rect width="264" height="30" rx="7" fill="url(#output)" stroke="#38bdf8"/></g>
    <g id="rowInput"><rect width="264" height="30" rx="7" fill="url(#input)" stroke="#f59e0b"/></g>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7891a8"/></marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="520" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="21" fill="none" stroke="#29455d"/>

  <g font-family="Inter,Arial,sans-serif">
    <text x="45" y="48" fill="#f8fafc" font-size="24" font-weight="700">Reorder → Copy → Prune</text>
    <g transform="translate(893 34)" font-size="11">
      <rect width="15" height="15" rx="4" fill="#0c6ea0" stroke="#38bdf8"/><text x="23" y="12" fill="#bae6fd">output</text>
      <rect x="96" width="15" height="15" rx="4" fill="#92400e" stroke="#f59e0b"/><text x="119" y="12" fill="#fde68a">input only</text>
    </g>

    <g font-size="11" font-weight="700" letter-spacing="1.2">
      <text x="45" y="87" fill="#9fb4c7">ORIGINAL EMBEDDING</text>
      <text x="450" y="87" fill="#67e8f9">REORDERED EMBEDDING</text>
      <text x="855" y="87" fill="#c4b5fd">UNTIED LM HEAD</text>
    </g>

    <rect x="45" y="100" width="300" height="286" rx="14" fill="#0b1b29" stroke="#35516a"/>
    <rect x="450" y="100" width="300" height="286" rx="14" fill="#0b1b29" stroke="#22d3ee"/>
    <rect x="855" y="100" width="300" height="286" rx="14" fill="#0b1b29" stroke="#a78bfa">
      <animate attributeName="height" dur="10s" repeatCount="indefinite" values="286;286;286;150;150;286" keyTimes="0;0.64;0.72;0.82;0.94;1"/>
    </rect>

    <g fill="none" stroke="#7891a8" stroke-width="2" marker-end="url(#arrow)">
      <path d="M365 243H425"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#7891a8;#22d3ee;#22d3ee;#7891a8;#7891a8" keyTimes="0;0.10;0.30;0.36;1"/></path>
      <path d="M770 243H830"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#7891a8;#7891a8;#a78bfa;#a78bfa;#7891a8" keyTimes="0;0.40;0.46;0.64;1"/></path>
    </g>
    <g text-anchor="middle" font-size="10" font-weight="700">
      <text x="397" y="228" fill="#67e8f9">1 · REORDER</text>
      <text x="802" y="228" fill="#c4b5fd">2 · COPY</text>
    </g>

    <!-- Original embedding: interleaved source. -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fff">
      <g transform="translate(63 122)"><use href="#rowOutput"/><text x="14" y="20">2  · zh_token</text></g>
      <g transform="translate(63 160)"><use href="#rowInput"/><text x="14" y="20">5  · fr_token</text></g>
      <g transform="translate(63 198)"><use href="#rowOutput"/><text x="14" y="20">8  · punct</text></g>
      <g transform="translate(63 236)"><use href="#rowInput"/><text x="14" y="20">14 · ar_token</text></g>
      <g transform="translate(63 274)"><use href="#rowOutput"/><text x="14" y="20">21 · 123</text></g>
      <g transform="translate(63 312)"><use href="#rowInput"/><text x="14" y="20">34 · ru_token</text></g>
    </g>

    <!-- 1: rows move into stable, grouped positions. -->
    <g opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.82;.82;0;0" keyTimes="0;.08;.12;.28;.34;1"/>
      <use href="#rowOutput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="63 122;63 122;468 122;468 122;63 122" keyTimes="0;.10;.30;.94;1"/></use>
      <use href="#rowInput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="63 160;63 160;468 236;468 236;63 160" keyTimes="0;.10;.30;.94;1"/></use>
      <use href="#rowOutput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="63 198;63 198;468 160;468 160;63 198" keyTimes="0;.10;.30;.94;1"/></use>
      <use href="#rowInput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="63 236;63 236;468 274;468 274;63 236" keyTimes="0;.10;.30;.94;1"/></use>
      <use href="#rowOutput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="63 274;63 274;468 198;468 198;63 274" keyTimes="0;.10;.30;.94;1"/></use>
      <use href="#rowInput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="63 312;63 312;468 312;468 312;63 312" keyTimes="0;.10;.30;.94;1"/></use>
    </g>

    <!-- The reordered embedding appears and stays full. -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fff" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;1;0" keyTimes="0;.29;.34;.82;.94;1"/>
      <g transform="translate(468 122)"><use href="#rowOutput"/><text x="14" y="20">0 · zh_token</text></g>
      <g transform="translate(468 160)"><use href="#rowOutput"/><text x="14" y="20">1 · punct</text></g>
      <g transform="translate(468 198)"><use href="#rowOutput"/><text x="14" y="20">2 · 123</text></g>
      <g transform="translate(468 236)"><use href="#rowInput"/><text x="14" y="20">3 · fr_token</text></g>
      <g transform="translate(468 274)"><use href="#rowInput"/><text x="14" y="20">4 · ar_token</text></g>
      <g transform="translate(468 312)"><use href="#rowInput"/><text x="14" y="20">5 · ru_token</text></g>
      <path d="M462 231H738" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="724" y="226" text-anchor="end" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">K</text>
    </g>

    <!-- 2: a copy moves right; the middle embedding remains. -->
    <g opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.80;.80;0;0" keyTimes="0;.40;.45;.60;.65;1"/>
      <use href="#rowOutput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="468 122;468 122;873 122;873 122;468 122" keyTimes="0;.42;.62;.94;1"/></use>
      <use href="#rowOutput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="468 160;468 160;873 160;873 160;468 160" keyTimes="0;.42;.62;.94;1"/></use>
      <use href="#rowOutput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="468 198;468 198;873 198;873 198;468 198" keyTimes="0;.42;.62;.94;1"/></use>
      <use href="#rowInput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="468 236;468 236;873 236;873 236;468 236" keyTimes="0;.42;.62;.94;1"/></use>
      <use href="#rowInput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="468 274;468 274;873 274;873 274;468 274" keyTimes="0;.42;.62;.94;1"/></use>
      <use href="#rowInput"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="468 312;468 312;873 312;873 312;468 312" keyTimes="0;.42;.62;.94;1"/></use>
    </g>

    <!-- Right copy: output prefix stays; input-only tail is removed here. -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fff" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;1;0" keyTimes="0;.60;.64;.82;.94;1"/>
      <g transform="translate(873 122)"><use href="#rowOutput"/><text x="14" y="20">0 · zh_token</text></g>
      <g transform="translate(873 160)"><use href="#rowOutput"/><text x="14" y="20">1 · punct</text></g>
      <g transform="translate(873 198)"><use href="#rowOutput"/><text x="14" y="20">2 · 123</text></g>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fff" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.60;.64;.72;.82;1"/>
      <g><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="873 236;873 236;901 236;901 236" keyTimes="0;.72;.82;1"/><use href="#rowInput"/><text x="14" y="20">3 · fr_token</text></g>
      <g><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="873 274;873 274;901 274;901 274" keyTimes="0;.72;.82;1"/><use href="#rowInput"/><text x="14" y="20">4 · ar_token</text></g>
      <g><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="873 312;873 312;901 312;901 312" keyTimes="0;.72;.82;1"/><use href="#rowInput"/><text x="14" y="20">5 · ru_token</text></g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.70;.76;.94;1"/>
      <path d="M865 232H1145" stroke="#f472b6" stroke-width="2" stroke-dasharray="6 5"/>
      <rect x="1067" y="235" width="70" height="14" rx="7" fill="#831843" stroke="#f472b6"/>
      <text x="1102" y="245" text-anchor="middle" fill="#fce7f3" font-size="8" font-weight="700">3 · PRUNE</text>
    </g>

    <rect x="45" y="421" width="1110" height="58" rx="12" fill="#091824" stroke="#2d465b"/>
    <text x="600" y="456" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">Full Embedding [V_input × H]  →  Compact LM Head [K × H]  ·  Direct token IDs</text>
  </g>
</svg>

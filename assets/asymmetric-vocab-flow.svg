<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Asymmetric output vocabulary pruning</title>
  <desc id="desc">Animated flow through unchanged input embeddings, a compact untied LM head, and original-ID logit scattering.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#102440"/></linearGradient>
    <linearGradient id="blue"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="violet"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#7190ad"/></marker>
    <path id="p1" d="M215 225H275"/><path id="p2" d="M465 225H525"/><path id="p3" d="M700 225H760"/><path id="p4" d="M950 225H1010"/>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#294563"/>
  <text x="50" y="54" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">Asymmetric Output Vocabulary Pruning</text>
  <text x="50" y="83" fill="#91a9c1" font-family="Arial,sans-serif" font-size="15">Full multilingual input · Compact output projection · Original token IDs preserved</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="45" y="145" width="170" height="160" rx="16" fill="#0d2037" stroke="#375a7d"/><text x="130" y="176" fill="#dbeafe" font-size="15" font-weight="700">Tokenizer IDs</text><text x="130" y="212" fill="#7dd3fc" font-size="14">FR 831 · AR 912</text><text x="130" y="242" fill="#7dd3fc" font-size="14">JA 420 · ZH 205</text><text x="130" y="280" fill="#91a9c1" font-size="12">IDs unchanged</text></g>
    <g><rect x="275" y="145" width="190" height="160" rx="16" fill="#0d2037" stroke="#22d3ee" stroke-width="2"/><text x="370" y="176" fill="#dbeafe" font-size="15" font-weight="700">Full Embedding</text><text x="370" y="204" fill="#67e8f9" font-size="13">[V_input, H]</text><g fill="#173b55"><rect x="306" y="222" width="128" height="10" rx="4"/><rect x="306" y="240" width="128" height="10" rx="4"/><rect x="306" y="258" width="128" height="10" rx="4"/></g><rect x="306" y="222" width="128" height="10" rx="4" fill="url(#blue)"><animate attributeName="y" values="222;258;240;222" dur="3s" repeatCount="indefinite"/></rect><text x="370" y="290" fill="#34d399" font-size="12" font-weight="700">UNCHANGED</text></g>
    <g><rect x="525" y="145" width="175" height="160" rx="16" fill="#0d2037" stroke="#526e8b"/><text x="612" y="176" fill="#dbeafe" font-size="15" font-weight="700">Transformer</text><text x="612" y="204" fill="#91a9c1" font-size="13">Attention + MLP</text><circle cx="575" cy="248" r="20" fill="none" stroke="#8b5cf6" stroke-width="3"/><circle cx="650" cy="248" r="20" fill="none" stroke="#d946ef" stroke-width="3"/><path d="M595 248H630" stroke="#a78bfa" stroke-width="3"/><circle cx="575" cy="248" r="7" fill="#d946ef"><animate attributeName="opacity" values=".3;1;.3" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="650" cy="248" r="7" fill="#8b5cf6"><animate attributeName="opacity" values="1;.3;1" dur="1.3s" repeatCount="indefinite"/></circle></g>
    <g><rect x="760" y="145" width="190" height="160" rx="16" fill="#0d2037" stroke="#a855f7" stroke-width="2"/><text x="855" y="176" fill="#dbeafe" font-size="15" font-weight="700">Compact LM Head</text><text x="855" y="204" fill="#d8b4fe" font-size="13">[V_output, H]</text><g fill="url(#violet)"><rect x="797" y="226" width="116" height="12" rx="4"/><rect x="797" y="247" width="116" height="12" rx="4"/><rect x="797" y="268" width="116" height="12" rx="4"/></g><text x="855" y="298" fill="#f0abfc" font-size="12" font-weight="700">UNTIED · PRUNED</text></g>
    <g><rect x="1010" y="145" width="145" height="160" rx="16" fill="#0d2037" stroke="#34d399" stroke-width="2"/><text x="1082" y="176" fill="#dbeafe" font-size="15" font-weight="700">Scatter</text><text x="1082" y="204" fill="#6ee7b7" font-size="13">Original IDs</text><text x="1082" y="242" fill="#86efac" font-size="14">100 · 205</text><text x="1082" y="274" fill="#fda4af" font-size="14">others = −∞</text></g>
  </g>
  <g fill="none" stroke="#7190ad" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/></g>
  <g fill="#67e8f9" filter="url(#glow)"><circle r="5"><animateMotion dur="1.7s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="5"><animateMotion dur="1.7s" begin=".35s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle r="5" fill="#d8b4fe"><animateMotion dur="1.7s" begin=".7s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><circle r="5" fill="#6ee7b7"><animateMotion dur="1.7s" begin="1.05s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle></g>
  <rect x="45" y="350" width="1110" height="70" rx="14" fill="#091a2e" stroke="#294563"/><text x="70" y="381" fill="#9fb6cb" font-family="monospace" font-size="14">compact row j → original token K[j] → full_logits[..., K[j]]</text><text x="70" y="405" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="13">Kept logits are unchanged. Removed token positions are −∞ and cannot be generated.</text>
</svg>

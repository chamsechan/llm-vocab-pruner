<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Stable vocabulary partition for compact LM Head pruning</title>
  <desc id="desc">Output tokens are blue and input-only tokens are amber. Animated token rows move from an interleaved original order into a stable output prefix followed by an input-only tail.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#07131f"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="outputRow" x2="1">
      <stop stop-color="#075985"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="inputRow" x2="1">
      <stop stop-color="#78350f"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="head" x2="1">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#7891a8"/>
    </marker>
  </defs>

  <rect width="1200" height="590" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="588" rx="21" fill="none" stroke="#29455d"/>

  <g font-family="Inter,Arial,sans-serif">
    <text x="48" y="43" fill="#f8fafc" font-size="24" font-weight="700">Stable Partition: Build a Compact Output Prefix</text>
    <text x="48" y="68" fill="#91a7ba" font-size="13">The same one-time permutation reorders tokenizer IDs and full Embedding rows.</text>

    <g transform="translate(835 34)">
      <rect width="15" height="15" rx="4" fill="#0c6ea0" stroke="#38bdf8"/>
      <text x="23" y="12" fill="#bae6fd" font-size="11">can generate</text>
      <rect x="120" width="15" height="15" rx="4" fill="#92400e" stroke="#f59e0b"/>
      <text x="143" y="12" fill="#fde68a" font-size="11">input only</text>
    </g>

    <text x="48" y="103" fill="#8ca5ba" font-size="11" font-weight="700" letter-spacing="1.3">ORIGINAL ORDER · COLORS ARE CLASSIFICATION</text>
    <rect x="48" y="115" width="404" height="265" rx="14" fill="#0b1b29" stroke="#35516a"/>
    <text x="70" y="134" fill="#9fb4c7" font-size="11">Output and input-only tokens are interleaved.</text>

    <g text-anchor="middle">
      <circle cx="530" cy="241" r="50" fill="#0b1b29" stroke="#41627c"/>
      <text x="530" y="230" fill="#f8fafc" font-size="12" font-weight="700">STABLE</text>
      <text x="530" y="247" fill="#67e8f9" font-size="12" font-weight="700">PARTITION P</text>
      <text x="530" y="266" fill="#8299ad" font-size="10">export time only</text>
    </g>

    <text x="608" y="103" fill="#67e8f9" font-size="11" font-weight="700" letter-spacing="1.3">REORDERED IDS + EMBEDDING ROWS</text>
    <rect x="608" y="115" width="544" height="265" rx="14" fill="#0b1b29" stroke="#22d3ee"/>
    <text x="630" y="134" fill="#9fb4c7" font-size="11">Relative order is preserved inside each color group.</text>
    <path d="M620 254H1138" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1138" y="249" text-anchor="end" fill="#6ee7b7" font-size="10" font-weight="700">OUTPUT PREFIX [0, K)</text>

    <g transform="translate(70 142)">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
        values="70 142;70 142;630 142;630 142;70 142"
        keyTimes="0;0.20;0.50;0.88;1"/>
      <rect width="360" height="30" rx="7" fill="url(#outputRow)" stroke="#38bdf8" stroke-opacity=".75"/>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
        old 2 · zh_token
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" opacity="0">
        new 0 ← old 2 · zh_token
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="344" y="20" text-anchor="end" fill="#dff8ff" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">OUTPUT</text>
    </g>
    <g transform="translate(70 178)">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
        values="70 178;70 178;630 266;630 266;70 178"
        keyTimes="0;0.20;0.50;0.88;1"/>
      <rect width="360" height="30" rx="7" fill="url(#inputRow)" stroke="#f59e0b" stroke-opacity=".75"/>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
        old 5 · fr_token
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" opacity="0">
        new 3 ← old 5 · fr_token
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="344" y="20" text-anchor="end" fill="#fff2cf" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">INPUT ONLY</text>
    </g>
    <g transform="translate(70 214)">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
        values="70 214;70 214;630 178;630 178;70 214"
        keyTimes="0;0.20;0.50;0.88;1"/>
      <rect width="360" height="30" rx="7" fill="url(#outputRow)" stroke="#38bdf8" stroke-opacity=".75"/>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
        old 8 · punct
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" opacity="0">
        new 1 ← old 8 · punct
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="344" y="20" text-anchor="end" fill="#dff8ff" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">OUTPUT</text>
    </g>
    <g transform="translate(70 250)">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
        values="70 250;70 250;630 302;630 302;70 250"
        keyTimes="0;0.20;0.50;0.88;1"/>
      <rect width="360" height="30" rx="7" fill="url(#inputRow)" stroke="#f59e0b" stroke-opacity=".75"/>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
        old 14 · ar_token
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" opacity="0">
        new 4 ← old 14 · ar_token
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="344" y="20" text-anchor="end" fill="#fff2cf" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">INPUT ONLY</text>
    </g>
    <g transform="translate(70 286)">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
        values="70 286;70 286;630 214;630 214;70 286"
        keyTimes="0;0.20;0.50;0.88;1"/>
      <rect width="360" height="30" rx="7" fill="url(#outputRow)" stroke="#38bdf8" stroke-opacity=".75"/>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
        old 21 · 123
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" opacity="0">
        new 2 ← old 21 · 123
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="344" y="20" text-anchor="end" fill="#dff8ff" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">OUTPUT</text>
    </g>
    <g transform="translate(70 322)">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
        values="70 322;70 322;630 338;630 338;70 322"
        keyTimes="0;0.20;0.50;0.88;1"/>
      <rect width="360" height="30" rx="7" fill="url(#inputRow)" stroke="#f59e0b" stroke-opacity=".75"/>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
        old 34 · ru_token
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" opacity="0">
        new 5 ← old 34 · ru_token
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.20;0.50;0.88;1"/>
      </text>
      <text x="344" y="20" text-anchor="end" fill="#fff2cf" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">INPUT ONLY</text>
    </g>

    <text x="48" y="421" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1.3">RUNTIME RESULT</text>
    <rect x="48" y="434" width="1104" height="104" rx="14" fill="#091824" stroke="#2d465b"/>

    <g text-anchor="middle">
      <g>
        <rect x="70" y="459" width="194" height="52" rx="9" fill="#10283a" stroke="#22d3ee"/>
        <text x="167" y="480" fill="#e0f2fe" font-size="11" font-weight="700">Reordered tokenizer</text>
        <text x="167" y="498" fill="#7dd3fc" font-size="10">full IDs 0 ... V_input−1</text>
      </g>
      <g>
        <rect x="318" y="459" width="194" height="52" rx="9" fill="#10283a" stroke="#22d3ee"/>
        <text x="415" y="480" fill="#e0f2fe" font-size="11" font-weight="700">Full Embedding</text>
        <text x="415" y="498" fill="#7dd3fc" font-size="10">[V_input, H]</text>
      </g>
      <g>
        <rect x="566" y="459" width="150" height="52" rx="9" fill="#10283a" stroke="#526e8b"/>
        <text x="641" y="490" fill="#e2e8f0" font-size="11" font-weight="700">Transformer</text>
      </g>
      <g>
        <rect x="770" y="459" width="174" height="52" rx="9" fill="url(#head)" stroke="#c084fc"/>
        <text x="857" y="480" fill="#fff" font-size="11" font-weight="700">Compact LM Head</text>
        <text x="857" y="498" fill="#f5d0fe" font-size="10">logits [..., K]</text>
      </g>
      <g>
        <rect x="998" y="459" width="132" height="52" rx="9" fill="#0c3b35" stroke="#34d399"/>
        <text x="1064" y="480" fill="#d1fae5" font-size="11" font-weight="700">Direct IDs</text>
        <text x="1064" y="498" fill="#6ee7b7" font-size="10">no runtime map</text>
      </g>
    </g>

    <g fill="none" stroke="#7891a8" stroke-width="2" marker-end="url(#arrow)">
      <path d="M264 485H318"/>
      <path d="M512 485H566"/>
      <path d="M716 485H770"/>
      <path d="M944 485H998"/>
    </g>

    <text x="600" y="564" text-anchor="middle" fill="#8299ad" font-size="11">Blue rows become LM Head rows 0..K−1. Amber rows remain available only to the input Embedding.</text>
  </g>
</svg>
